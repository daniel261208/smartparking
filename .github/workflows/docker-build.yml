name: Docker Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Web Docker Image
        run: docker build -t smartparking-web ./web

      - name: Build Storage Docker Image
        run: docker build -t smartparking-storage ./storage